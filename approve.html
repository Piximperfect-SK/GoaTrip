<!DOCTYPE html>
<html lang="en">
<head>
<script>/* theme bootstrap: set before first paint to avoid a flash. THEME_DEFAULT = 'light' (use matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light' to follow the OS instead) */(function(){var t='light';try{t=localStorage.getItem('goaTheme')||'light';}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0B3D3A" />
<title>Admin request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
  *{ box-sizing:border-box; }
  h1,h2,.display{ font-family:'Fraunces', serif; letter-spacing:-0.01em; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;
    background:
      radial-gradient(38% 42% at 8% 12%, rgba(255,122,69,.55), transparent 60%),
      radial-gradient(34% 38% at 92% 18%, rgba(30,96,145,.45), transparent 60%),
      radial-gradient(40% 46% at 88% 88%, rgba(62,124,89,.4), transparent 60%),
      radial-gradient(46% 50% at 4% 92%, rgba(201,162,39,.35), transparent 60%),
      linear-gradient(175deg, var(--teal-900), var(--teal-800) 55%, var(--teal-900));
    background-attachment:fixed;
  }
  .card{
    width:100%; max-width:400px; background:linear-gradient(160deg, rgba(251,246,236,.98), rgba(239,230,214,.96));
    border-radius:26px; padding:40px 30px; text-align:center;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.4) inset;
    border:1px solid rgba(255,255,255,.5);
  }
  .badge{
    width:60px; height:60px; border-radius:18px; margin:0 auto 18px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, var(--teal-800), var(--teal-900));
    box-shadow:0 10px 22px -8px rgba(11,61,58,.55);
  }
  .badge svg{ width:26px; height:26px; color:var(--sand); }
  .badge.ok{ background:linear-gradient(155deg, var(--palm), #2c5940); }
  .badge.bad{ background:linear-gradient(155deg, var(--mango-2), #8A2E12); }
  h1{ font-size:1.5rem; margin:0 0 6px; color:var(--ink); }
  p.sub{ font-size:14px; color:var(--teal-700); opacity:.85; margin:0; line-height:1.5; }
  .spinner{
    width:22px; height:22px; border-radius:50%; margin:0 auto 18px;
    border:3px solid rgba(15,38,34,.15); border-top-color:var(--mango);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  a.back{ display:inline-block; margin-top:22px; font-size:12.5px; color:var(--teal-700); opacity:.7; text-decoration:none; }
</style>
<style id="dark-theme">
/* Dark theme — generated from this page's CSS + shared.css by gen-dark.js; every rule is scoped to html[data-theme="dark"], so light mode is untouched. */
html[data-theme="dark"]{
  color-scheme:dark;
  --ink:#F2F2F4; --paper:#0F0F12; --sand-2:#1C1C21; --line:#2F2F36;
  --azulejo:#5B8DFF; --azulejo-2:#7CA3FF; --surface:#17171B; --surface-2:#1F1F25; --text-2:#C6C6CD;
}
html[data-theme="light"]{ color-scheme:light; }
html[data-theme="dark"] ::selection{ background:var(--mango); color:#fff; }

:root:where([data-theme="dark"]){--ink:rgb(240,240,241);--bp-ink:rgb(80,145,225);--bp-cardbg:rgb(23,23,27)}
html:where([data-theme="dark"]) .btn-danger{background:rgb(23,23,27)}
html:where([data-theme="dark"]) .card{background:rgb(23,23,27)}
html:where([data-theme="dark"]) .panel{background:rgb(23,23,27)}
html:where([data-theme="dark"]) label,html:where([data-theme="dark"]) .field-label{color:var(--text-2)}
html:where([data-theme="dark"]) .field-row input,html:where([data-theme="dark"]) .field-row select,html:where([data-theme="dark"]) .field-row textarea,html:where([data-theme="dark"]) input[type="text"],html:where([data-theme="dark"]) input[type="date"],html:where([data-theme="dark"]) input[type="number"],html:where([data-theme="dark"]) input[type="time"],html:where([data-theme="dark"]) textarea{background:rgb(23,23,27)}
html:where([data-theme="dark"]) .theme-toggle{background:var(--surface, rgb(23,23,27))}
html:where([data-theme="dark"]) .card{background:linear-gradient(160deg, rgba(29,29,34,0.98), rgba(70,57,32,0.96));border:1px solid rgba(48,48,56,0.5)}
html:where([data-theme="dark"]) p.sub{color:var(--text-2)}
html:where([data-theme="dark"]) .spinner{border:3px solid rgba(255,255,255,0.173)}
html:where([data-theme="dark"]) a.back{color:var(--text-2)}

/* ---- inline style="" fallbacks: inline styles beat normal rules, so these need !important ---- */
html[data-theme="dark"] [style*="background:white"], html[data-theme="dark"] [style*="background: white"],
html[data-theme="dark"] [style*="background:#fff"], html[data-theme="dark"] [style*="background: #fff"],
html[data-theme="dark"] [style*="background:var(--sand)"], html[data-theme="dark"] [style*="background: var(--sand)"]{ background:var(--surface) !important; }
html[data-theme="dark"] [style*="color:var(--teal-700)"], html[data-theme="dark"] [style*="color: var(--teal-700)"]{ color:var(--text-2) !important; }
html[data-theme="dark"] [style*="color:var(--teal-800)"], html[data-theme="dark"] [style*="color: var(--teal-800)"],
html[data-theme="dark"] [style*="color:var(--teal-900)"], html[data-theme="dark"] [style*="color: var(--teal-900)"]{ color:var(--ink) !important; }
html[data-theme="dark"] [style*="background:rgba(29,29,31"], html[data-theme="dark"] [style*="background: rgba(29,29,31"]{ background:rgba(255,255,255,.08) !important; }
/* info tooltip keeps a saturated blue with white text in dark mode */
html[data-theme="dark"] .field-tooltip.info{ background:#2E6FF2; }

</style>
</head>
<body>
  <div class="card" id="card">
    <div class="badge" id="confirmBadge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
    </div>
    <h1 id="title">Confirm this action</h1>
    <p class="sub" id="sub">Checking the link…</p>
    <button type="button" id="confirmBtn" class="btn-primary" style="display:none; margin-top:18px;" onclick="runAction()"></button>
  </div>

<script src="/js/shared.js"></script>
<script>
const params = new URLSearchParams(location.search);
const action = params.get('action'); // 'approve' | 'reject'
const token = params.get('token');

function render(kind, title, sub){
  document.getElementById('card').innerHTML = `
    <div class="badge ${kind}">
      ${kind === 'ok'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>'}
    </div>
    <h1>${title}</h1>
    <p class="sub">${sub}</p>
    <a class="back" href="admin.html">Go to admin console →</a>
  `;
}

// IMPORTANT: this page deliberately does NOT fire the approve/reject
// request automatically on load. Mail/security link scanners (Outlook
// Safe Links, corporate proxies, Gmail's own prefetching, etc.) visit
// every URL in an email before a human ever opens it — if the action
// fired on load, a scanner bot could silently approve or reject the
// request before the real approver sees it. Instead, the request only
// fires from an explicit click on the confirm button below.
function runAction(){
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = 'Working…';
  document.getElementById('sub').textContent = 'Contacting the admin backend.';
  fetch(FUNCTIONS_BASE + '/approve?' + new URLSearchParams({ action, token }).toString())
    .then(res => res.json())
    .then(data => {
      render(
        data.ok ? 'ok' : 'bad',
        data.ok ? (action === 'approve' ? 'Approved' : 'Rejected') : 'Notice',
        data.message || 'Something went wrong — please try again.'
      );
    })
    .catch(() => {
      render('bad', 'Could not reach the backend', 'Check your connection and try again.');
    });
}

(function init(){
  if(!action || !token || (action !== 'approve' && action !== 'reject')){
    render('bad', 'Invalid link', 'This link is missing required information.');
    return;
  }
  const verb = action === 'approve' ? 'Approve' : 'Reject';
  document.getElementById('title').textContent = `${verb} this admin request?`;
  document.getElementById('sub').textContent = action === 'approve'
    ? 'This will grant admin access and email a temporary PIN to the requester.'
    : 'This will deny the request. It can\u2019t be undone from this link.';
  const btn = document.getElementById('confirmBtn');
  btn.textContent = `${verb} request`;
  btn.style.display = 'inline-block';
})();
</script>
</body>
</html>
