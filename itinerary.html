/* Lenis smooth scroll CSS, inlined (unpkg.com isn't in style-src) */
html.lenis, html.lenis body{ height:auto; }
.lenis:not(.lenis-autoToggle).lenis-stopped{ overflow:clip; }
.lenis [data-lenis-prevent],
.lenis [data-lenis-prevent-wheel],
.lenis [data-lenis-prevent-touch],
.lenis [data-lenis-prevent-vertical],
.lenis [data-lenis-prevent-horizontal]{ overscroll-behavior:contain; }
.lenis.lenis-smooth iframe{ pointer-events:none; }
.lenis.lenis-autoToggle{ transition-property:overflow; transition-duration:1ms; transition-behavior:allow-discrete; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--paper); color:var(--ink); font-family:'Space Grotesk', sans-serif; -webkit-font-smoothing:antialiased; position:relative;}
h1,h2,h3,.display{font-family:'Fraunces', serif; letter-spacing:-0.01em;}
.mono{font-family:'Space Mono', monospace;}
#topbar{position:sticky; top:0; z-index:30; background:rgba(251,251,253,.92); -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%); color:var(--ink); padding:calc(14px + var(--sat)) 20px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--line);}
.btn-icon{width:34px; height:34px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; border:1.5px solid var(--line); background:white; color:var(--ink); text-decoration:none; flex-shrink:0;}
/* shared.css's #topbar a{color:var(--sand)} targets the OLD dark topbar and
   otherwise wins on specificity (ID beats class) over .btn-icon/.btn-ghost
   here, painting topbar links near-white — invisible on this light topbar. */
#topbar a.btn-icon, #topbar a.btn-ghost{ color:var(--ink); opacity:1; }
.btn-icon:hover{background:var(--sand-2); border-color:var(--ink);}
.btn-primary:disabled{opacity:.5; cursor:not-allowed; transform:none; box-shadow:none;}
.btn-danger:active{transform:scale(.96);}
@media (max-width:640px){ input, select, textarea{font-size:16px;} }
label{font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--teal-700); opacity:.85; display:block; margin-bottom:6px;}
input[type="text"], input[type="date"], input[type="time"], input:not([type]), select, textarea{
  width:100%; border:1.5px solid var(--line); border-radius:12px;
  padding:11px 13px; background:white; color:var(--ink);
  font-family:'Space Grotesk',sans-serif; font-size:13.5px; line-height:1.3;
  outline:none; transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
input::placeholder, textarea::placeholder{color:var(--ink); opacity:.35;}
input:focus, select:focus, textarea:focus{ border-color:var(--mango); box-shadow:0 0 0 4px rgba(255,122,69,.14); }
select:not([multiple]){appearance:none; -webkit-appearance:none; padding-right:34px; cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%231D1D1F' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round' opacity='0.55'/></svg>");
  background-repeat:no-repeat; background-position:right 12px center;
}
.banner{border-radius:12px; padding:12px 16px; font-size:13px;}
.banner.err{background:#FBEAE4; color:#8A2E12; border:1px solid #F0BCA7;}
.banner.ok{background:#E9F3EC; color:#1F5136; border:1px solid #B9DBC4;}
.banner.warn{background:#FBF3DC; color:#7A5A05; border:1px solid #EFD98C;}
.sync-dot{width:9px; height:9px; border-radius:9999px; display:inline-block;}
.sync-dot.ok{background:var(--palm); box-shadow:0 0 0 3px rgba(62,124,89,.18);}
.sync-dot.bad{background:var(--mango-2); box-shadow:0 0 0 3px rgba(232,93,42,.18);}
.sync-dot.pending{background:#C9A227; animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

.itin-page-content{position:relative; z-index:1;}
.itin-hero{position:relative; padding:64px 20px 8px; color:var(--ink); text-align:left;}
.itin-hero .itin-hero-text p{margin:0;}
.itin-hero .itin-hero-text p:first-child{font-size:11px; letter-spacing:.14em; opacity:.5; margin-bottom:10px;}
.itin-hero .hero-eyebrow-rule{width:34px; height:2px; background:var(--mango); display:inline-block; vertical-align:middle; margin-right:10px;}
.itin-hero .itin-hero-text p:last-child{font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,5vw,38px); line-height:1.08;}
@media(max-width:640px){.itin-hero{padding:48px 20px 6px;}}

.page-gradient{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; background:var(--paper);}
.pg-blob{position:absolute; width:56vw; height:56vw; max-width:760px; max-height:760px; border-radius:50%; filter:blur(120px) saturate(130%); opacity:.4; mix-blend-mode:multiply; will-change:transform, background; transition:background 1.1s ease-out;}
.pg-blob-1{top:-14%; left:-12%; animation:pgDriftA 30s ease-in-out infinite;}
.pg-blob-2{top:32%; right:-16%; animation:pgDriftB 34s ease-in-out infinite;}
.pg-blob-3{bottom:-18%; left:22%; animation:pgDriftC 38s ease-in-out infinite;}
@keyframes pgDriftA{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(4vw,3vh) scale(1.08);}}
@keyframes pgDriftB{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-3vw,4vh) scale(1.1);}}
@keyframes pgDriftC{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(3vw,-3vh) scale(1.06);}}
@media (max-width:640px){ .pg-blob{ width:85vw; height:85vw; opacity:.32; } }
@media (prefers-reduced-motion:reduce){ .pg-blob{ animation:none; transition:background 1.1s ease-out; } }

.day-tabs::-webkit-scrollbar{ display:none; }
.day-tab{

  transition:.18s; min-width:92px;
}

.day-tab .dt-date{ font-weight:700; font-size:13.5px; }

/* ---------- Day header card ---------- */
.day-head{ padding:18px 20px; margin-bottom:22px; }
.tag-chip{ display:inline-flex; align-items:center; gap:5px; font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; padding:5px 12px; border-radius:9999px; cursor:pointer; border:1.5px solid var(--line); background:white; transition:.15s; }

/* ---------- Timeline ---------- */
.timeline{ position:relative; padding-left:34px; }
.timeline::before{ content:''; position:absolute; left:13px; top:6px; bottom:6px; width:2px; background:linear-gradient(var(--line), var(--line)); border-radius:2px; }
.tl-item{ position:relative; margin-bottom:16px; }
.tl-node{

.tl-card{ padding:16px; }
.tl-top-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px; }
.tod-chip{
  font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase;

  display:inline-flex; align-items:center; gap:4px;
}
.tod-chip.active{ background:var(--mango); border-color:var(--mango); color:white; }
.time-pill{ font-family:'Space Mono',monospace; font-size:11.5px; padding:5px 10px; border-radius:9999px; background:var(--sand-2); border:1px solid var(--line); display:inline-flex; align-items:center; gap:6px; }
.time-pill input{ border:none; background:transparent; padding:0; width:74px; font-size:11.5px; }
.time-pill input:focus{ box-shadow:none; }
.activity-title-input{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; border:none; padding:2px 0; background:transparent; }
.activity-title-input:focus{ box-shadow:none; border-bottom:1.5px solid var(--mango); border-radius:0; }
.icon-select{ width:52px; text-align:center; font-size:17px; padding:8px 4px; flex-shrink:0; }
.place-row{ display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:8px 10px; background:var(--sand-2); margin-top:10px; }
.place-thumb{ width:42px; height:42px; border-radius:8px; object-fit:cover; flex-shrink:0; background:white; }
.place-thumb.empty{ display:flex; align-items:center; justify-content:center; font-size:15px; opacity:.4; }
.place-row input{ flex:1; min-width:0; background:white; }
.place-status{ font-size:10.5px; white-space:nowrap; flex-shrink:0; }
.place-status.ok{ color:var(--palm); }
.place-status.bad{ color:var(--mango-2); }
.place-status.pending{ color:#C9A227; }
.note-toggle{ font-size:11.5px; opacity:.55; cursor:pointer; margin-top:8px; display:inline-block; }
.note-toggle:hover{ opacity:.85; }
.activity-note{ margin-top:6px; font-size:13px; min-height:56px; }
.tl-actions{ display:flex; gap:6px; margin-top:10px; justify-content:flex-end; }
.tl-mini-btn{ font-size:11.5px; padding:5px 10px; border-radius:9999px; border:1px solid var(--line); background:white; cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:4px; }
.tl-mini-btn:hover{ border-color:var(--ink); }
.tl-mini-btn.danger{ color:var(--mango-2); border-color:rgba(232,93,42,.35); }
.tl-mini-btn.danger:hover{ background:rgba(232,93,42,.08); }

.add-activity-card{ border:1.5px dashed var(--line); border-radius:16px; padding:16px; background:rgba(255,255,255,.5); text-align:center; }
.add-activity-btn{ width:100%; background:transparent; border:none; padding:14px; font-weight:600; font-size:13.5px; color:var(--teal-700); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
.add-activity-btn:hover{ color:var(--mango-2); }

.empty-state{ text-align:center; padding:48px 20px; opacity:.5; font-size:13.5px; }

<script>
/* ============================================================
   PAGE GRADIENT — same treatment as index.html
=============================================================*/
const PG_PALETTE = ['#FF6B4A', '#F5B942', '#F26FA0', '#2E6FF2', '#2E8B57'];
function pgHexToRgb(hex){ const v = hex.replace('#',''); return [parseInt(v.slice(0,2),16), parseInt(v.slice(2,4),16), parseInt(v.slice(4,6),16)]; }
const PG_PALETTE_RGB = PG_PALETTE.map(pgHexToRgb);
function pgColorAt(t){
  const n = PG_PALETTE_RGB.length;
  const scaled = ((t % 1) + 1) % 1 * n;
  const i = Math.floor(scaled) % n; const j = (i + 1) % n; const f = scaled - Math.floor(scaled);
  const a = PG_PALETTE_RGB[i], b = PG_PALETTE_RGB[j];
  return `${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)}`;
}
const pgBlobEls = [document.getElementById('pgBlob1'), document.getElementById('pgBlob2'), document.getElementById('pgBlob3')];
function updatePageGradient(frac){
  if(!pgBlobEls[0]) return;
  const offsets = [0, 0.33, 0.66];
  pgBlobEls.forEach((el, i) => { if(!el) return; const rgb = pgColorAt(frac*1.4+offsets[i]); el.style.background = `radial-gradient(circle, rgba(${rgb},1) 0%, rgba(${rgb},0) 72%)`; });
}
(function(){
  let ticking = false;
  function onScroll(){ const max = document.body.scrollHeight - window.innerHeight; const frac = max>0 ? Math.min(1,Math.max(0,window.scrollY/max)) : 0; updatePageGradient(frac); ticking=false; }
  onScroll();
  window.addEventListener('scroll', () => { if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } }, { passive:true });
  window.addEventListener('resize', onScroll);
})();
</script>
<script>
/* ============================================================
   CONFIG — Netlify Functions backend, scoped to the resolved trip
=============================================================*/
function loadLocal(){ try{ return JSON.parse(localStorage.getItem('goaItineraryDraft')) || null; }catch(e){ return null; } }
function persistLocal(){ localStorage.setItem('goaItineraryDraft', JSON.stringify(days)); }

let days = loadLocal() || [];
let activeDayIndex = 0;

function setSyncStatus(state, meta){
  const dot = document.getElementById('syncDot'); const label = document.getElementById('syncLabel');
  dot.className = 'sync-dot ' + (state==='ok'?'ok':state==='bad'?'bad':'pending');
  label.textContent = state==='ok' ? 'Synced' : state==='bad' ? 'Offline — local draft' : 'Syncing…';
  if(meta) label.title = meta;
}
function showBanner(kind, html){
  document.getElementById('bannerZone').innerHTML = html ? `<div class="banner ${kind}">${html}</div>` : '';
  if(kind==='ok'){ clearTimeout(showBanner._t); showBanner._t = setTimeout(()=>{ if(document.querySelector('.banner.ok')) showBanner(); }, 4000); }
}

/* ============================================================
   DATA MODEL MIGRATION
   Old shape: { day, date, title, tag, tbd, items:[string], places:[{name,photo,...}] }
   New shape: { day, date, title, tag, tbd, activities:[{
     id, timeOfDay, icon, title, startTime, endTime, place, note
   }] }
   Old itinerary blobs (already saved to the backend, or the site's
   hardcoded default) are converted the first time they're touched here
   so nothing existing breaks — old items become title-only activities,
   zipped with whatever place was at the same index.
=============================================================*/
function genId(){ return 'a' + Math.random().toString(36).slice(2,9); }
function guessTimeOfDay(text){
  const s = String(text||'').toLowerCase();
  if(/\b(morning|breakfast|sunrise)\b/.test(s)) return 'morning';
  if(/\b(afternoon|lunch|noon)\b/.test(s)) return 'afternoon';
  if(/\b(evening|dinner|sunset)\b/.test(s)) return 'evening';
  if(/\b(night|late)\b/.test(s)) return 'night';
  return null;
}
function guessIcon(text){
  const s = String(text||'').toLowerCase();
  if(/\bbeach|shore|coast\b/.test(s)) return '🏖️';
  if(/\bbreakfast|lunch|dinner|food|restaurant|cafe|eat\b/.test(s)) return '🍽️';
  if(/\bfort|temple|church|basilica|heritage|museum\b/.test(s)) return '🏛️';
  if(/\bshop|market|bazaar\b/.test(s)) return '🛍️';
  if(/\bcab|train|flight|drive|transfer|board|airport|station\b/.test(s)) return '🚗';
  if(/\bparty|club|dj|night\b/.test(s)) return '🎉';
  if(/\bcruise|boat|kayak|water\b/.test(s)) return '🚤';
  if(/\bcheck.?in|hotel|villa|resort\b/.test(s)) return '🏡';
  return '📍';
}
function migrateDay(d){
  if(Array.isArray(d.activities)) return d;
  const items = d.items || [];
  const places = d.places || [];
  const activities = items.map((text, i) => ({
    id: genId(), timeOfDay: guessTimeOfDay(text) || (i===0?'morning':i===items.length-1?'evening':'afternoon'),
    icon: guessIcon(text), title: (text||'').trim() || 'Untitled activity',
    startTime:'', endTime:'', place: places[i] ? {...places[i]} : null, note:'',
  }));
  for(let i=items.length;i<places.length;i++){
    activities.push({ id: genId(), timeOfDay:'morning', icon: guessIcon(places[i].name), title: places[i].name || 'Place', startTime:'', endTime:'', place: places[i], note:'' });
  }
  return { day:d.day, date:d.date, title:d.title, tag:d.tag, tbd:d.tbd, activities };
}
function migrateAll(list){ return (list||[]).map(migrateDay); }

const TOD_META = {
  morning:   { label:'Morning',   icon:'🌅' },
  afternoon: { label:'Afternoon', icon:'☀️' },
  evening:   { label:'Evening',   icon:'🌇' },
  night:     { label:'Night',     icon:'🌙' },
};
const ICON_CHOICES = ['📍','🏖️','🍽️','🏛️','🛍️','🚗','🎉','🚤','🏡','⛰️','🎭','📸'];

async function pullItinerary(manual){
  if(!window.TRIP){ setSyncStatus('bad'); render(); return; }
  setSyncStatus('pending');
  try{
    const res = await fetch(FUNCTIONS_BASE + '/itinerary?tripId=' + encodeURIComponent(TRIP.id));
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    if(Array.isArray(data.days) && data.days.length){ days = migrateAll(data.days); persistLocal(); }
    else if(!days.length && Array.isArray(TRIP.defaultItinerary)){ days = migrateAll(JSON.parse(JSON.stringify(TRIP.defaultItinerary))); }
    else{ days = migrateAll(days); }
    if(activeDayIndex >= days.length) activeDayIndex = 0;
    setSyncStatus('ok');
    showBanner('ok', manual ? 'Reloaded from the backend.' : '');
    if(!manual) showBanner();
  }catch(err){
    setSyncStatus('bad');
    days = migrateAll(days);
    showBanner('err', `Couldn't reach the backend. Working from the last local draft. ${err.message}`);
  }
  render();
  backfillMissingPhotos();
}

// Places saved before photo-matching existed are stuck at status:'ok'
// with photo:null forever — resolveActivityPlace() only ever runs on
// blur/Enter of the name field, so nothing would ever ask for their
// photo again on its own. This runs once per itinerary load, quietly
// re-resolves just those places (their name/coords are already known,
// so it's a cheap cache-hit + photo-match round trip, not a full
// re-geocode), and saves the result so index.html's carousel — which
// only ever reads what's already stored, never calls /places itself —
// picks the photos up on its next load too.
async function backfillMissingPhotos(){
  let changed = false;
  for(const d of days){
    for(const a of (d.activities||[])){
      const p = a.place;
      if(!p || p.status !== 'ok' || p.lat == null || p.photo) continue;
      try{
        const resolved = await resolvePlace(p.resolvedName || p.name);
        if(resolved && resolved.photo){
          p.photo = resolved.photo; p.caption = resolved.photoTitle || resolved.name;
          p.source = resolved.photoSource; p.photoCandidates = resolved.photoCandidates || [];
          changed = true;
        }
      }catch(e){ /* leave it — will just retry on next load */ }
    }
  }
  if(changed){
    render();
    persistLocal();
    if(window.TRIP) saveItinerary();
  }
}

async function saveItinerary(){
  persistLocal();
  if(!window.TRIP){ showBanner('warn', 'Trip not resolved yet — try reloading the page.'); return; }
  setSyncStatus('pending');
  try{
    const res = await fetch(FUNCTIONS_BASE + '/itinerary?tripId=' + encodeURIComponent(TRIP.id), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'saveItinerary', payload:{days}, ts:new Date().toISOString()})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    setSyncStatus('ok');
    showBanner('ok', 'Saved — the homepage itinerary will pick this up on next load.');
  }catch(err){
    setSyncStatus('bad');
    showBanner('err', `Save failed: ${err.message}. Your changes are kept locally — try Save again once the backend is reachable.`);
  }
}

(async function boot(){
  const trip = await initTripContext();
  document.title = `Itinerary Planner — ${trip.name}`;
  const sub = document.getElementById('itinSubtitle');
  if(sub) sub.textContent = trip.shortDates ? `${trip.name.toUpperCase()} · ${trip.shortDates}` : trip.name.toUpperCase();
  const route = document.getElementById('itinRoute');
  if(route) route.textContent = `ROUTE · ${(trip.origin||'').toUpperCase()} → ${(trip.waypoint||'').toUpperCase()} → ${(trip.destination||'').toUpperCase()}`;
  const mapLink = document.getElementById('mapViewLink');
  if(mapLink) mapLink.href = withTrip('test_itenary.html');
  // Fetched once and cached rather than calling applyFeatureFlags() again
  // on every edit — the day/activity list re-renders on almost every
  // keystroke (updateActivity, updateDay, …), and re-fetching the flag
  // list from the network that often would be wasteful. reapplyFeatureFlags()
  // below re-applies this same cached result to whatever's newly in the DOM.
  // Key is 'itinerary.editing' to match the server-side check in
  // itinerary.js's POST handler — this client-side tag is a courtesy
  // (hides the controls before someone wastes a click); the real
  // enforcement is server-side either way.
  cachedFeatureFlags = await applyFeatureFlags(trip.id);
  await pullItinerary();
})();

/* ============================================================
   RENDER — day tabs + the active day's timeline
=============================================================*/
const dayTabsEl = document.getElementById('dayTabs');
const dayBodyEl = document.getElementById('dayBody');
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

let cachedFeatureFlags = {};
function reapplyFeatureFlags(){
  document.querySelectorAll('[data-feature]').forEach(node => {
    if(cachedFeatureFlags[node.dataset.feature] === false){
      if(['INPUT','BUTTON','SELECT','TEXTAREA'].includes(node.tagName)){
        node.setAttribute('disabled', 'disabled');
        node.title = 'This feature is currently restricted.';
      }else{
        node.style.display = 'none';
      }
      node.classList.add('feature-restricted');
    }
  });
}

function fmtDateShort(iso){
  if(!iso) return 'No date';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short' });
}

function render(){
  if(!days.length){
    dayTabsEl.innerHTML = '';
    dayBodyEl.innerHTML = `<div class="empty-state">No days yet — add your first one to start planning.</div>
      <div class="text-center mt-3"><button class="btn-primary" data-feature="itinerary.editing" onclick="addDay()">+ Add day</button></div>`;
    reapplyFeatureFlags();
    return;
  }
  if(activeDayIndex >= days.length) activeDayIndex = days.length - 1;

  dayTabsEl.innerHTML = days.map((d,di)=>`
    <div class="day-tab ${di===activeDayIndex?'active':''} ${d.tbd?'tbd':''}" onclick="setActiveDay(${di})">
      <span class="dt-label">${escAttr(d.day||('Day '+(di+1)))}</span>
      <span class="dt-date">${d.date ? fmtDateShort(d.date) : (d.tbd ? 'TBD' : '—')}</span>
    </div>`).join('')
    + `<div class="day-tab-add" data-feature="itinerary.editing" onclick="addDay()" title="Add day">+</div>`;

  const d = days[activeDayIndex];
  const di = activeDayIndex;
  const acts = d.activities || [];

  dayBodyEl.innerHTML = `
    <div class="card day-head">
      <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 flex-1 min-w-[260px]">
          <div><label>Day label</label><input value="${escAttr(d.day)}" oninput="updateDay(${di},'day',this.value)"/></div>
          <div><label>Date</label><input type="date" value="${/^\d{4}-\d{2}-\d{2}$/.test(d.date||'') ? d.date : ''}" onchange="updateDay(${di},'date',this.value)"/></div>
          <div class="sm:col-span-2"><label>Status</label>
            <div class="tag-row">
              ${['TRAVEL','ACTIVITY','FREE','TBD'].map(t=>`<span class="tag-chip ${d.tag===t?'active':''}" onclick="updateDay(${di},'tag','${t}')">${t}</span>`).join('')}
            </div>
          </div>
        </div>
        <button class="btn-danger" data-feature="itinerary.editing" onclick="removeDay(${di})">Remove day</button>
      </div>
      <label>Title</label>
      <input value="${escAttr(d.title)}" oninput="updateDay(${di},'title',this.value)" placeholder="e.g. Beach day & sunset cruise"/>
    </div>

    <div class="timeline">
      ${acts.map((a,ai)=>renderActivity(d, di, a, ai)).join('') || ''}
    </div>
    ${!acts.length ? `<div class="empty-state">No activities yet for this day.</div>` : ''}

    <div class="add-activity-card">
      <button class="add-activity-btn" data-feature="itinerary.editing" onclick="addActivity(${di})">
        <span style="font-size:16px;">＋</span> Add Activity
      </button>
    </div>
  `;
  reapplyFeatureFlags();
}

function renderActivity(d, di, a, ai){
  const tod = TOD_META[a.timeOfDay] || TOD_META.morning;
  const p = a.place;
  const directionsUrl = (p && p.lat!=null && p.lng!=null && window.TRIP && TRIP.villaLat!=null)
    ? mapsDirectionsUrl({lat:TRIP.villaLat,lng:TRIP.villaLng},{lat:p.lat,lng:p.lng})
    : (p && p.lat!=null ? `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}` : null);
  return `
    <div class="tl-item">
      <div class="tl-node">${a.icon || '📍'}</div>
      <div class="card tl-card">
        <div class="tl-top-row">
          <select class="icon-select" onchange="updateActivity(${di},${ai},'icon',this.value)" title="Icon">
            ${ICON_CHOICES.map(ic=>`<option ${a.icon===ic?'selected':''}>${ic}</option>`).join('')}
          </select>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            ${Object.keys(TOD_META).map(key=>`
              <span class="tod-chip ${a.timeOfDay===key?'active':''}" onclick="updateActivity(${di},${ai},'timeOfDay','${key}')">
                ${TOD_META[key].icon} ${TOD_META[key].label}
              </span>`).join('')}
          </div>
          <span class="time-pill">🕙 <input type="time" value="${escAttr(a.startTime)}" onchange="updateActivity(${di},${ai},'startTime',this.value)"/> – <input type="time" value="${escAttr(a.endTime)}" onchange="updateActivity(${di},${ai},'endTime',this.value)"/></span>
        </div>

        <input class="activity-title-input" value="${escAttr(a.title)}" placeholder="What's happening?" oninput="updateActivity(${di},${ai},'title',this.value)"/>

        <div class="place-row">
          ${p && p.photo ? `<img class="place-thumb" src="${escAttr(p.photo)}" alt="${escAttr(p.name)}"/>` : `<span class="place-thumb empty">🖼</span>`}
          <input value="${escAttr(p ? p.name : '')}" placeholder="📍 Location (e.g. Palolem Beach)"
            oninput="updateActivityPlaceName(${di},${ai},this.value)"
            onblur="resolveActivityPlace(${di},${ai})"
            onkeydown="if(event.key==='Enter'){event.preventDefault(); resolveActivityPlace(${di},${ai});}"/>
          <span class="place-status ${p?p.status||'':''}">${placeStatusLabel(p)}</span>
        </div>

        <div onclick="toggleNote(${di},${ai})" class="note-toggle">${a.note ? '📝 Edit note' : '📝 Add note'}</div>
        ${a._noteOpen || a.note ? `<textarea class="activity-note" rows="2" placeholder="Optional note…" oninput="updateActivity(${di},${ai},'note',this.value)">${escAttr(a.note)}</textarea>` : ''}

        <div class="tl-actions">
          ${directionsUrl ? `<a class="tl-mini-btn" href="${directionsUrl}" target="_blank" rel="noopener">🧭 Directions</a>` : ''}
          ${ai>0 ? `<button class="tl-mini-btn" data-feature="itinerary.editing" onclick="moveActivity(${di},${ai},-1)" title="Move up">↑</button>` : ''}
          ${ai < (d.activities.length-1) ? `<button class="tl-mini-btn" data-feature="itinerary.editing" onclick="moveActivity(${di},${ai},1)" title="Move down">↓</button>` : ''}
          <button class="tl-mini-btn danger" data-feature="itinerary.editing" onclick="removeActivity(${di},${ai})">✕ Remove</button>
        </div>
      </div>
    </div>`;
}

function setActiveDay(di){ activeDayIndex = di; render(); }

function updateDay(di, key, val){ days[di][key] = val; if(key==='tag') render(); }
function addDay(){
  days.push({ day:`Day ${days.length+1}`, date:'', title:'New day', tag:'TBD', tbd:true, activities:[] });
  activeDayIndex = days.length - 1;
  render();
}
function removeDay(di){
  if(!confirm('Remove this day from the itinerary?')) return;
  days.splice(di,1);
  if(activeDayIndex >= days.length) activeDayIndex = Math.max(0, days.length-1);
  render();
}

function addActivity(di){
  days[di].activities = days[di].activities || [];
  const count = days[di].activities.length;
  const rotation = ['morning','afternoon','evening','night'];
  days[di].activities.push({
    id: genId(), timeOfDay: rotation[count % rotation.length], icon:'📍',
    title:'', startTime:'', endTime:'', place:null, note:'',
  });
  render();
}
function updateActivity(di, ai, key, val){ days[di].activities[ai][key] = val; render(); }
function toggleNote(di, ai){ const a = days[di].activities[ai]; a._noteOpen = !a._noteOpen; render(); }
function removeActivity(di, ai){ days[di].activities.splice(ai,1); render(); }
function moveActivity(di, ai, dir){
  const arr = days[di].activities;
  const j = ai + dir;
  if(j < 0 || j >= arr.length) return;
  [arr[ai], arr[j]] = [arr[j], arr[ai]];
  render();
}

/* ============================================================
   PLACES — resolution + photo matching is now entirely server-side
   (see /places function): it geocodes the name AND finds a matched,
   coordinate-verified photo in one call. This page just displays
   whatever comes back and shows a clean "unresolved" state otherwise.
=============================================================*/
function placeStatusLabel(p){
  if(!p) return '';
  if(p.status === 'pending') return 'Resolving…';
  if(p.status === 'ok') return (p.lat!=null ? '📍 ' : '') + (p.photoSource ? p.photoSource[0].toUpperCase()+p.photoSource.slice(1) : 'Resolved');
  if(p.status === 'bad') return 'Unresolved — check spelling';
  return '';
}
function updateActivityPlaceName(di, ai, val){
  const a = days[di].activities[ai];
  if(!a.place) a.place = { name:'', photo:null, status:'' };
  a.place.name = val;
}
async function resolveActivityPlace(di, ai){
  const a = days[di] && days[di].activities && days[di].activities[ai];
  if(!a || !a.place) return;
  const p = a.place;
  const rawName = (p.name||'').trim();
  if(!rawName){ a.place = null; render(); return; }
  if(p.status === 'ok' && p._fetchedFor === rawName && p.photo) return;
  p.status = 'pending';
  render();
  try{
    const resolved = await resolvePlace(rawName);
    if(!resolved){
      p.photo = null; p.lat = null; p.lng = null; p.resolvedName = null; p.status = 'bad';
      render();
      return;
    }
    p.lat = resolved.lat; p.lng = resolved.lng;
    p.resolvedName = resolved.name; p.displayName = resolved.displayName; p.placeType = resolved.type;
    p.photo = resolved.photo; p.caption = resolved.photoTitle || resolved.name; p.source = resolved.photoSource;
    p.photoCandidates = resolved.photoCandidates || [];
    p.status = 'ok'; p._fetchedFor = rawName;
  }catch(err){
    console.warn('Place resolution failed for', JSON.stringify(rawName), err);
    p.photo = null; p.lat = null; p.lng = null; p.resolvedName = null; p.status = 'bad';
  }
  render();
}

render();
</script>
