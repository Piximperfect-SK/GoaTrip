[build.environment]
  GIT_LFS_ENABLED = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ============================================================
# Security headers — applies to every path on the site.
# Added alongside the existing Cache-Control rules below; Netlify
# merges header blocks that match the same request, so this doesn't
# touch caching behaviour for /videos/* or /*.html.
#
# connect-src includes BOTH script.google.com and
# script.googleusercontent.com — Apps Script Web App responses are
# actually served from script.googleusercontent.com under the hood
# (a redirect from the script.google.com URL you call), so both are
# needed or every fetch to the backend gets blocked.
#
# Spline (index.html hero) additions, added site-wide rather than
# scoped to /index.html only — Netlify doesn't reliably merge two
# [[headers]] blocks that both set Content-Security-Policy for
# overlapping paths, so a second block risks silently overriding
# this one instead of extending it. The three additions below are
# low-risk everywhere else since no other page loads the viewer:
#   - script-src 'wasm-unsafe-eval': Spline's runtime compiles WASM
#   - connect-src https://prod.spline.design: scene data host
#   - worker-src 'self' blob:: viewer spins up a worker via blob URL
#
# frame-src is new here too: with no frame-src directive at all, iframes
# fall back to default-src 'self', which silently blocks an embedded
# Google Maps iframe (<iframe src="https://www.google.com/maps/embed?...">).
# img-src also picks up maps.gstatic.com / maps.googleapis.com, which the
# Maps embed UI loads its own tile/icon images from, and a wildcard
# *.wikimedia.org — Wikipedia/Commons now serve thumbnails from several
# subdomains (thumb.wikimedia.org as well as upload.wikimedia.org), and
# pinning to one specific subdomain silently blocks images served from
# the others.
#
# connect-src also picks up unpkg.com — itinerary.html loads Lenis
# (smooth scroll) from unpkg.com via a <script> tag; CSP enforces
# connect-src for that fetch, not just script-src, so without this the
# script request itself gets blocked even though script-src allows it.
#
# font-src picks up 'self' and data: — the Tailwind CDN build (loaded
# for script-src above) injects its own @font-face rules that reference
# fonts as inline base64 data: URIs rather than fetching from
# fonts.gstatic.com, so font-src needs to allow those directly or the
# browser blocks every one of them.
#
# Circuit map (test_itenary.html) additions — Leaflet is already
# script-src-allowed via unpkg.com (itinerary.html's Lenis load added
# that earlier), but its own stylesheet is a separate <link> tag, which
# style-src enforces independently, so unpkg.com needed adding there
# too. img-src picks up *.tile.openstreetmap.org and
# *.basemaps.cartocdn.com — Leaflet's tile layer requests map tile
# images from whichever CDN subdomain it's configured with ({s} in the
# tile URL template), so both need to stay wildcarded rather than
# pinned to one subdomain.
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://api.qrserver.com https://*.wikimedia.org https://maps.gstatic.com https://maps.googleapis.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; media-src 'self'; connect-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://en.wikipedia.org https://commons.wikimedia.org https://api.unsplash.com https://prod.spline.design; frame-src https://www.google.com https://maps.google.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
    
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
