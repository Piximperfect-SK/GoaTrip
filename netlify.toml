[build.environment]
  GIT_LFS_ENABLED = "true"

# ============================================================
# Security headers — applies to every path on the site.
# Added alongside the existing Cache-Control rules below; Netlify
# merges header blocks that match the same request, so this doesn't
# touch caching behaviour for /videos/* or /*.html.
#
# connect-src includes BOTH script.google.com and
# script.googleusercontent.com — Apps Script Web App responses are
# actually served from script.googleusercontent.com under the hood
# (a redirect from the script.google.com URL you call), so both are
# needed or every fetch to the backend gets blocked.
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://api.qrserver.com https://upload.wikimedia.org; media-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://cdn.jsdelivr.net https://en.wikipedia.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
    
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
